<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d16">
  <title>Não foi possível enviar | Visible</title>
  <link rel="icon" type="image/png" href="assets/favicon_logo.png">
  <meta name="robots" content="noindex,follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root {
      color-scheme: dark;
      --page-bg: #080d16;
      --card-bg: #111a28;
      --field-bg: #0b1220;
      --line: #29384c;
      --main-text: #f3f6fb;
      --soft-text: #aab7c8;
      --blue: #2563eb;
      --yellow: #f4c430
    }

    * {
      box-sizing: border-box
    }

    body {
      background: var(--page-bg);
      color: var(--main-text)
    }

    .page-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 18px;
      background: radial-gradient(ellipse at top left, rgba(37, 99, 235, .19), transparent 45%), radial-gradient(ellipse at bottom right, rgba(244, 196, 48, .08), transparent 38%), var(--page-bg)
    }

    .page-card {
      width: min(100%, 760px);
      padding: clamp(24px, 5vw, 48px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(20, 31, 48, .98), rgba(12, 19, 31, .98));
      box-shadow: 0 24px 70px rgba(0, 0, 0, .38)
    }

    .page-card h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.12;
      margin: 10px 0 16px;
      color: var(--main-text)
    }

    .page-card>p {
      color: var(--soft-text);
      line-height: 1.75
    }

    .page-brand {
      display: block;
      width: 150px;
      max-width: 45%;
      margin: 0 auto 26px
    }

    .page-brand img {
      width: 100%;
      height: auto
    }

    .page-eyebrow {
      font-size: .78rem;
      letter-spacing: .12em;
      font-weight: 800;
      color: var(--yellow)
    }

    .contact-form {
      display: grid;
      gap: 18px;
      margin-top: 28px
    }

    .form-field {
      display: grid;
      gap: 8px
    }

    .form-field label {
      font-weight: 700;
      font-size: .9rem;
      color: #e8eef8
    }

    .form-field input,
    .form-field select,
    .form-field textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #35445a;
      border-radius: 10px;
      background: var(--field-bg);
      color: var(--main-text);
      font: inherit
    }

    .form-field select option {
      background: var(--field-bg);
      color: var(--main-text)
    }

    .form-field input::placeholder,
    .form-field textarea::placeholder {
      color: #8b9bb0
    }

    .form-field input:focus,
    .form-field select:focus,
    .form-field textarea:focus {
      outline: 3px solid rgba(244, 196, 48, .2);
      border-color: var(--yellow)
    }

    .form-field textarea {
      min-height: 150px;
      resize: vertical
    }

    .form-note {
      font-size: .8rem;
      color: var(--soft-text);
      line-height: 1.5
    }

    .page-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 26px
    }

    .contact-details {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      margin-top: 22px;
      color: var(--soft-text);
      font-size: .9rem
    }

    .contact-details a {
      color: var(--yellow);
      overflow-wrap: anywhere
    }

    .page-card .btn-primary {
      background: var(--blue);
      color: #fff;
      border: 1px solid var(--blue)
    }

    .page-card .btn-primary:hover {
      background: #1d4ed8
    }

    .page-card .btn-secondary {
      background: transparent;
      color: var(--main-text);
      border: 1px solid #46566d
    }

    .page-card .btn-secondary:hover {
      border-color: var(--yellow);
      color: var(--yellow)
    }

    .status-symbol {
      font-size: 2.5rem;
      margin-bottom: 12px;
      color: var(--yellow)
    }

    @media(max-width:560px) {
      .page-wrap {
        padding: 22px 14px
      }

      .page-card {
        border-radius: 18px
      }

      .page-actions .btn {
        width: 100%
      }
    }
  </style>
</head>

<body>
  <main class="page-wrap">
    <section class="page-card" aria-labelledby="page-title">
      <a class="page-brand" href="index.html" aria-label="Visible - página inicial"><img src="assets/VisiBle.png" alt="Visible"></a>
      <div class="status-symbol" aria-hidden="true">!</div>
      <p class="page-eyebrow">NÃO FOI POSSÍVEL CONCLUIR</p>
      <h1 id="page-title">Sua mensagem não foi enviada.</h1>
      <p>Ocorreu um problema durante o envio. Você pode voltar ao formulário e tentar novamente ou falar diretamente com a Visible pelo WhatsApp ou e-mail.</p>
      <div class="page-actions"><a class="btn btn-primary" href="contato.html">Tentar novamente</a><a class="btn btn-secondary" href="https://wa.me/5554996772904" target="_blank" rel="noopener noreferrer">Falar pelo WhatsApp</a><a class="btn btn-secondary" href="mailto:rfsrafaelsilva@icloud.com">Enviar e-mail</a></div>
    </section>
  </main>
  <script src="script.js" defer></script>
</body>

</html>
